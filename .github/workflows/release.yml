# Al subir una etiqueta vX.Y.Z se compila el instalador de Windows y se publica en GitHub Releases.
# La app instalada lee esas releases para actualizarse sola, y la web las muestra en la sección de descargas.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      # La versión de app/package.json debe coincidir con la etiqueta (v0.2.0 ↔ "version": "0.2.0")
      - name: Comprobar versión
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then echo "La etiqueta ($TAG) no coincide con package.json ($PKG)"; exit 1; fi

      - name: Compilar
        run: npx electron-builder --win --publish never

      # Se publica con gh y no con electron-builder: al subir los archivos en paralelo,
      # electron-builder puede crear dos releases con la misma etiqueta.
      # Las notas salen de app/notas/vX.Y.Z.md (la web las muestra); si no existe, se generan solas.
      - name: Publicar
        shell: bash
        run: |
          if [ -f "notas/$GITHUB_REF_NAME.md" ]; then NOTAS=(--notes-file "notas/$GITHUB_REF_NAME.md"); else NOTAS=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" --title "Chinchero $GITHUB_REF_NAME" "${NOTAS[@]}" \
            dist/Chinchero-Setup-*.exe dist/Chinchero-Setup-*.exe.blockmap dist/latest.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
