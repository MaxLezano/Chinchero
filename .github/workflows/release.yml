# Al subir una etiqueta vX.Y.Z se compilan los instaladores de Windows (x64 y ARM64) y se publican en GitHub Releases.
# La app instalada lee esas releases para actualizarse sola, y la web las muestra en la sección de descargas.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      # La versión de app/package.json debe coincidir con la etiqueta (v0.2.0 ↔ "version": "0.2.0")
      - name: Comprobar versión
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then echo "La etiqueta ($TAG) no coincide con package.json ($PKG)"; exit 1; fi

      # Dos instaladores (x64 y -arm64) y un solo latest.yml con los dos: cada PC se actualiza con el suyo
      - name: Compilar
        run: node scripts/dist.js --publish never

      # Se publica con gh y no con electron-builder: al subir los archivos en paralelo,
      # electron-builder puede crear dos releases con la misma etiqueta.
      # Las notas salen de app/notas/vX.Y.Z.md (la web las muestra); si no existe, se generan solas.
      - name: Publicar
        shell: bash
        run: |
          if [ -f "notas/$GITHUB_REF_NAME.md" ]; then NOTAS=(--notes-file "notas/$GITHUB_REF_NAME.md"); else NOTAS=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" --title "Chinchero $GITHUB_REF_NAME" "${NOTAS[@]}" \
            dist/Chinchero-Setup-*.exe dist/Chinchero-Setup-*.exe.blockmap dist/latest.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Manda el PR de la versión nueva a winget (microsoft/winget-pkgs) desde el fork MaxLezano/winget-pkgs.
  # Necesita el secreto WINGET_TOKEN (token clásico con permiso public_repo); sin él, se saltea.
  # Solo funciona si el paquete MaxLezano.Chinchero ya existe en winget (el primero se mandó a mano).
  winget:
    needs: windows
    runs-on: windows-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Publicar en winget
        if: env.WINGET_TOKEN != ''
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: MaxLezano.Chinchero
          installers-regex: 'Chinchero-Setup-.*\.exe$'
          release-notes-url: https://github.com/MaxLezano/Chinchero/releases/tag/${{ github.ref_name }}
          token: ${{ secrets.WINGET_TOKEN }}
