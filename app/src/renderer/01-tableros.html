<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chinchero — Tableros</title>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="assets/theme.css">
<link rel="stylesheet" href="assets/shell.css">
<script src="assets/theme.js"></script>
<script src="assets/store.js"></script>
<style>
  .search { margin-left: auto; display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; width: 260px; color: var(--text-muted); }
  .search input { border: 0; outline: 0; background: none; color: var(--text); font: inherit; flex: 1; min-width: 0; }
  .search kbd { font-size: 10px; }
  .subbar { display: flex; gap: 6px; padding: 0 32px 16px; align-items: center; flex-wrap: wrap; }
  .chip { border: 1px solid var(--border); background: var(--surface); padding: 5px 12px; border-radius: 999px; font-size: 13px; }
  .chip.active { background: var(--text); color: var(--bg); border-color: var(--text); }
  .sort { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-muted); }
  .sort[hidden] { display: none; }
  .sort select { background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 5px 8px; font: inherit; }

  /* Sugerencias */
  .suggest { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; padding: 0 32px 20px; }
  .sug { position: relative; display: flex; gap: 12px; align-items: flex-start; background: var(--surface); border: 1px solid var(--border); border-left: 4px solid #fab005; border-radius: 12px; padding: 14px 36px 14px 14px; }
  .sug .em { font-size: 24px; line-height: 1; }
  .sug b { display: block; margin-bottom: 2px; }
  .sug p { margin: 0 0 8px; color: var(--text-muted); font-size: 13px; line-height: 1.4; }
  .sug .link { border: 0; background: none; color: var(--accent); font-weight: 600; padding: 0; font-size: 13px; }
  .sug .x { position: absolute; top: 8px; right: 8px; width: 24px; height: 24px; border: 0; background: none; color: var(--text-muted); border-radius: 6px; }
  .sug .x:hover { background: var(--surface-2); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; padding: 0 32px 40px; }
  .card { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; text-decoration: none; color: inherit; box-shadow: var(--shadow); transition: transform .15s; }
  .card:hover { transform: translateY(-2px); }
  .card[hidden] { display: none; }
  .card.dragging { opacity: .4; }
  .thumb { height: 150px; position: relative; overflow: hidden; border-bottom: 1px solid var(--border); }
  .mini { position: absolute; width: 46px; height: 42px; box-shadow: 0 2px 4px rgba(0,0,0,.2); }
  .mini .pin { width: 8px; height: 8px; top: -3px; }
  .mini.photo { background: #fff; padding: 3px 3px 9px; }
  .mini.photo i { display: block; width: 100%; height: 100%; }
  .mini.zone { box-shadow: none; border-radius: 6px; }
  /* Miniatura generada a partir de los elementos reales del tablero (ver computePreview en editor.js) */
  .pv-box { position: absolute; inset: 9% 7%; }
  .pv { position: absolute; display: block; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  .pv.photo { background: #fff; border: 2px solid #fff; border-bottom-width: 6px; background-image: linear-gradient(135deg, #74c0fc, #845ef7); background-clip: content-box; }
  .pv.card { background: #fff; }
  .pv.zone { box-shadow: none; border-radius: 4px; background: color-mix(in srgb, var(--zc) 22%, transparent); border: 1px solid color-mix(in srgb, var(--zc) 55%, transparent); }
  .pv.dot { border-radius: 50%; box-shadow: 0 0 0 1px #fff; }
  .pv.text { box-shadow: none; background: var(--text); opacity: .55; border-radius: 2px; max-height: 4px; }
  .pv.draw { box-shadow: none; border: 1.5px solid; border-radius: 40%; border-left-color: transparent; }
  .pv .pin { width: 6px; height: 6px; top: -2px; }
  .thumb svg.th { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .card-body { padding: 12px 14px; }
  .card-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-meta { color: var(--text-muted); font-size: 12px; margin-top: 4px; display: flex; gap: 6px; align-items: center; white-space: nowrap; overflow: hidden; }
  .gchip { position: absolute; left: 8px; bottom: 8px; display: flex; align-items: center; gap: 6px; max-width: calc(100% - 16px); background: var(--surface); color: var(--text); font-size: 11px; font-weight: 600; padding: 4px 8px; border-radius: 99px; box-shadow: var(--shadow); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gchip .group-dot { width: 8px; height: 8px; }
  .fav-btn { position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; border-radius: 8px; border: 0; background: var(--surface); color: var(--text-muted); display: grid; place-items: center; opacity: 0; box-shadow: var(--shadow); }
  .card:hover .fav-btn, .card:focus-within .fav-btn, .card.fav .fav-btn { opacity: 1; }
  .card.fav .fav-btn { color: #f59f00; }
  .card.fav .fav-btn .icon { fill: currentColor; }
  .new-card { border: 2px dashed var(--border); border-radius: 12px; display: grid; place-items: center; min-height: 214px; color: var(--text-muted); background: transparent; gap: 8px; align-content: center; }
  .new-card:hover { border-color: var(--accent); color: var(--accent); }

  .empty { display: none; text-align: center; padding: 60px 16px; color: var(--text-muted); }
  .empty.show { display: block; }
  .empty-art { width: 220px; height: 150px; margin: 0 auto 20px; border-radius: 12px; position: relative; border: 8px solid #d9b98c; box-shadow: var(--shadow); }
  .empty-art .note { position: absolute; left: 70px; top: 36px; width: 64px; height: 58px; background: var(--note-yellow); transform: rotate(-6deg); font: 700 15px/1 var(--font-hand); color: var(--note-ink); padding: 18px 6px 6px; box-shadow: 0 6px 10px -4px rgba(0,0,0,.4); }
  .empty h3 { color: var(--text); margin: 0 0 6px; }
  .empty p { margin: 0 0 18px; }

  .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; place-items: center; z-index: 20; padding: 16px; }
  .backdrop.open { display: grid; }
  .modal { background: var(--surface); border-radius: 14px; width: min(620px, 100%); max-height: calc(100vh - 32px); overflow: auto; padding: 24px; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
  .modal h2 { margin: 0 0 18px; font-size: 18px; }
  .field { display: grid; gap: 6px; margin-bottom: 16px; border: 0; padding: 0; }
  .field > label, .field legend { font-size: 12px; font-weight: 600; color: var(--text-muted); padding: 0; margin-bottom: 6px; }
  .field input, .field select { background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 9px 10px; color: var(--text); font: inherit; }
  .opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
  .opt { border: 2px solid var(--border); border-radius: 10px; padding: 0; overflow: hidden; background: none; text-align: center; font-size: 12px; }
  .opt div { height: 60px; position: relative; }
  .opt span { display: block; padding: 6px; }
  .opt small { display: block; color: var(--text-muted); padding: 0 6px 8px; font-size: 11px; line-height: 1.3; }
  .opt.selected { border-color: var(--accent); }
  .opt .tpl { font-size: 26px; display: grid; place-items: center; background: var(--surface-2); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }

  @media (max-width: 720px) {
    .subbar, .grid, .suggest { padding-left: 16px; padding-right: 16px; }
    .search { width: auto; flex: 1; }
    .tip { left: 16px; }
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></symbol>
</svg>

<aside class="sidebar" id="sidebar"></aside>

<main>
  <div class="topbar">
    <h1 id="title"></h1>
    <label class="search"><svg class="icon"><use href="#i-search"/></svg><input id="search" placeholder="Buscar tableros…" aria-label="Buscar tableros"><kbd>Ctrl F</kbd></label>
    <button class="btn btn-primary" id="newBtn" onclick="openModal()"><svg class="icon"><use href="#i-plus"/></svg>Nuevo tablero</button>
  </div>
  <div class="subbar" id="chips">
    <button class="chip active" data-f="all">Todos</button>
    <button class="chip" data-f="today">Editados hoy</button>
    <button class="chip" data-f="img">Con imágenes</button>
    <label class="sort">Ordenar <select id="sort" aria-label="Ordenar tableros"><option value="date">Última edición</option><option value="name">Nombre</option></select></label>
  </div>

  <section class="suggest" id="suggest" aria-label="Sugerencias"></section>
  <section class="grid" id="grid"></section>

  <div class="empty" id="empty">
    <div class="empty-art surface-cork"><div class="note"><span class="pin"></span>¡Hola!</div></div>
    <h3 id="emptyTitle"></h3>
    <p id="emptyText"></p>
    <button class="btn btn-primary" id="emptyBtn" onclick="openModal()"><svg class="icon"><use href="#i-plus"/></svg>Nuevo tablero</button>
  </div>
</main>

<div class="backdrop" id="modal" onclick="if(event.target===this)closeModal()">
  <form class="modal" id="newForm" role="dialog" aria-labelledby="newTitle">
    <h2 id="newTitle">Nuevo tablero</h2>
    <div class="field"><label for="boardName">Nombre</label><input id="boardName" value="Sin título" required></div>
    <div class="field"><label for="groupSelect">Grupo</label><select id="groupSelect"></select></div>
    <fieldset class="field"><legend>Empezar con</legend>
      <div class="opts" id="templates">
        <button type="button" class="opt selected" data-v="blank"><div class="tpl">📄</div><span>En blanco</span><small>Lienzo vacío</small></button>
        <button type="button" class="opt" data-v="detective"><div class="tpl">🕵️</div><span>Detective</span><small>Fotos y notas unidas con hilos</small></button>
        <button type="button" class="opt" data-v="kanban"><div class="tpl">📋</div><span>Kanban</span><small>Por hacer, haciendo, hecho</small></button>
        <button type="button" class="opt" data-v="semana"><div class="tpl">📅</div><span>Semana</span><small>Lunes a domingo, ideas y pendientes</small></button>
        <button type="button" class="opt" data-v="moodboard"><div class="tpl">🎨</div><span>Moodboard</span><small>Imágenes y paleta</small></button>
        <button type="button" class="opt" data-v="viaje"><div class="tpl">✈️</div><span>Viaje</span><small>Itinerario, lugares, equipaje</small></button>
      </div>
    </fieldset>
    <fieldset class="field"><legend>Fondo</legend>
      <div class="opts" id="surfaces">
        <button type="button" class="opt" data-v="dots"><div class="surface-dots"></div><span>Puntos</span></button>
        <button type="button" class="opt" data-v="cork"><div class="surface-cork"></div><span>Corcho</span></button>
        <button type="button" class="opt" data-v="grid"><div class="surface-grid"></div><span>Cuadrícula</span></button>
        <button type="button" class="opt" data-v="plain"><div class="surface-plain"></div><span>Liso</span></button>
      </div>
    </fieldset>
    <div class="modal-actions">
      <button type="button" class="btn" onclick="closeModal()">Cancelar</button>
      <button type="submit" class="btn btn-primary">Crear tablero</button>
    </div>
  </form>
</div>

<script>
  // Vista según la URL: ?group=<id> o ?view=recent|fav (por defecto, recientes)
  const params = new URLSearchParams(location.search);
  let view = params.get("view"), groupId = params.get("group");
  if (groupId && !Store.group(groupId)) groupId = null;
  if (!groupId && !view) view = "recent";

  // Al abrir la app, vuelve al último tablero (una vez por sesión, si está activado en Ajustes)
  if (!location.search && !sessionStorage.getItem("started")) {
    sessionStorage.setItem("started", "1");
    const last = getPref("lastBoardId");
    if (getPref("lastboard") !== "0" && last && Store.board(last)) location.replace("02-tablero.html?board=" + last);
  }
  sessionStorage.setItem("started", "1");
  document.getElementById("sidebar").dataset.active = view || "group:" + groupId;
</script>
<script src="assets/ui.js"></script>
<script src="assets/guide.js"></script>
<script src="assets/sidebar.js"></script>
<script>
  const $ = s => document.querySelector(s);
  const grid = $("#grid");
  const lib = Store.library();
  const group = groupId ? Store.group(groupId) : null;
  const NOTE = { yellow: "var(--note-yellow)", blue: "var(--note-blue)", pink: "var(--note-pink)", green: "var(--note-green)", purple: "var(--note-purple)", orange: "#ffc078", white: "#f8f9fa" };
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  let chip = "all";

  $("#title").innerHTML = group
    ? `<span class="group-dot" style="background:${group.color};width:14px;height:14px"></span>${esc(group.name)}`
    : view === "fav" ? "Favoritos" : "Recientes";
  if (view === "recent") $("#sort").closest(".sort").hidden = true;

  // Miniatura: coordenadas ya normalizadas por el editor (0..1 dentro del recuadro de la tarjeta)
  function miniHTML(p) {
    const st = `left:${p.x * 100}%;top:${p.y * 100}%;width:${Math.max(2, p.w * 100)}%;height:${Math.max(3, p.h * 100)}%;transform:rotate(${p.r || 0}deg)`;
    const pin = p.pin ? `<span class="pin" style="--pin:${p.pc || "#e03131"}"></span>` : "";
    switch (p.t) {
      case "zone": return `<i class="pv zone" style="${st};--zc:${p.c}"></i>`;
      case "note": return `<i class="pv note" style="${st};background:${NOTE[p.c] || NOTE.yellow}">${pin}</i>`;
      case "photo": return `<i class="pv photo" style="${st}">${pin}</i>`;
      case "sticker": case "stamp": return `<i class="pv dot" style="${st};background:${p.c || "#fab005"}"></i>`;
      case "text": return `<i class="pv text" style="${st}"></i>`;
      case "draw": return `<i class="pv draw" style="${st};border-color:${p.c}"></i>`;
      default: return `<i class="pv card" style="${st}">${pin}</i>`;
    }
  }

  function cardHTML(b) {
    const g = Store.group(b.group);
    const n = b.sheets || 1;
    return `<a class="card${b.fav ? " fav" : ""}" href="02-tablero.html?board=${b.id}" data-id="${b.id}">
      <button class="fav-btn" aria-label="${b.fav ? "Quitar de favoritos" : "Añadir a favoritos"}"><svg class="icon"><use href="#i-star"/></svg></button>
      <div class="thumb surface-${b.surface || "dots"}"><div class="pv-box">${(b.preview || []).map(miniHTML).join("")}</div>
        ${!group && g ? `<span class="gchip"><span class="group-dot" style="background:${g.color}"></span>${esc(g.name)}</span>` : ""}</div>
      <div class="card-body"><div class="card-title">${esc(b.name)}</div>
        <div class="card-meta">${n} hoja${n > 1 ? "s" : ""} · ${b.items || 0} elemento${b.items === 1 ? "" : "s"} · ${relTime(b.updatedAt)}</div></div></a>`;
  }

  const sameDay = ts => ts && new Date(ts).toDateString() === new Date().toDateString();

  function render() {
    const q = $("#search").value.trim().toLowerCase();
    const sort = view === "recent" ? "date" : $("#sort").value;
    const list = lib.boards
      .filter(b => group ? b.group === group.id : view !== "fav" || b.fav)
      .filter(b => chip === "all" || (chip === "today" ? sameDay(b.updatedAt) : b.hasImages))
      .filter(b => b.name.toLowerCase().includes(q))
      .sort((a, b) => sort === "name" ? a.name.localeCompare(b.name) : (b.updatedAt || 0) - (a.updatedAt || 0));
    grid.innerHTML = list.map(cardHTML).join("")
      + (group ? '<button class="new-card" id="newCard" onclick="openModal()"><svg class="icon" style="width:28px;height:28px"><use href="#i-plus"/></svg>Nuevo tablero</button>' : "");
    setGroupCounts();

    const empty = !list.length;
    grid.style.display = empty ? "none" : "";
    $("#empty").classList.toggle("show", empty);
    if (empty) {
      const filtering = q || chip !== "all";
      const none = !lib.boards.length;
      $("#emptyTitle").textContent = filtering ? "Sin resultados" : none ? "Aún no tienes tableros" : view === "fav" ? "Aún no hay favoritos" : "Este grupo está vacío";
      $("#emptyText").textContent = filtering ? "Prueba con otro nombre o quita los filtros."
        : view === "fav" ? "Pulsa la ⭐ de un tablero para tenerlo siempre a mano." : "Crea un tablero en blanco o empieza con una plantilla.";
      $("#emptyBtn").style.display = filtering || view === "fav" ? "none" : "";
    }
  }

  $("#search").oninput = render;
  $("#sort").onchange = render;
  $("#chips").onclick = e => {
    const b = e.target.closest(".chip"); if (!b) return;
    $("#chips .active").classList.remove("active"); b.classList.add("active");
    chip = b.dataset.f; render();
  };
  document.addEventListener("groups-changed", render);

  grid.addEventListener("click", e => {
    const fav = e.target.closest(".fav-btn"); if (!fav) return;
    e.preventDefault();
    const b = Store.board(fav.closest(".card").dataset.id);
    Store.touch(b.id, { fav: !b.fav });
    toast(b.fav ? "Añadido a favoritos" : "Quitado de favoritos");
    render();
  });

  /* ---------- Mover tableros de grupo ---------- */
  function moveTo(id, gid) {
    const b = Store.board(id);
    if (!b || b.group === gid) return;
    const from = b.group;
    Store.touch(id, { group: gid });
    render();
    toast(`Movido a «${Store.group(gid).name}»`, "Deshacer", () => { Store.touch(id, { group: from }); render(); });
  }
  grid.addEventListener("dragstart", e => {
    const c = e.target.closest(".card"); if (!c) return;
    e.dataTransfer.setData("text/board", c.dataset.id);
    e.dataTransfer.effectAllowed = "move";
    c.classList.add("dragging");
  });
  grid.addEventListener("dragend", e => e.target.closest?.(".card")?.classList.remove("dragging"));
  document.addEventListener("board-move", e => moveTo(e.detail.board, e.detail.group));

  /* ---------- Acciones sobre un tablero ---------- */
  function rename(id) {
    const title = grid.querySelector(`[data-id="${id}"] .card-title`);
    title.contentEditable = "true"; title.focus();
    document.getSelection().selectAllChildren(title);
    title.onclick = ev => ev.preventDefault();
    title.onkeydown = ev => { if (ev.key === "Enter" || ev.key === "Escape") { ev.preventDefault(); title.blur(); } };
    title.onblur = () => {
      title.contentEditable = "false";
      Store.touch(id, { name: title.textContent.trim() || "Sin título" });
      render();
    };
  }
  function duplicate(id) {
    const b = Store.board(id), doc = Store.loadBoard(id);
    const copy = { ...JSON.parse(JSON.stringify(b)), id: Store.uid(), name: b.name + " (copia)", fav: false, createdAt: Date.now(), updatedAt: Date.now() };
    if (doc) Store.saveBoard(copy.id, { ...doc, name: copy.name });
    lib.boards.push(copy);
    Store.saveLibrary();
    render(); toast("Tablero duplicado");
  }
  function remove(id) {
    const entry = Store.trashBoard(id);
    render();
    toast("Tablero enviado a la papelera", "Deshacer", () => { Store.restore(entry.id); render(); });
  }

  grid.addEventListener("contextmenu", e => {
    const card = e.target.closest(".card");
    if (!card) return;
    e.preventDefault();
    const id = card.dataset.id, b = Store.board(id);
    showMenu(e.clientX, e.clientY, [
      { label: "Abrir", kbd: "Enter", action: () => card.click() },
      { label: b.fav ? "Quitar de favoritos" : "Añadir a favoritos", action: () => { Store.touch(id, { fav: !b.fav }); render(); } },
      { label: "Renombrar", kbd: "F2", action: () => rename(id) },
      { label: "Duplicar", action: () => duplicate(id) },
      { label: "Mover a grupo…", action: () => showMenu(e.clientX + 12, e.clientY + 12,
        lib.groups.filter(g => g.id !== b.group).map(g => ({ label: "→ " + g.name, action: () => moveTo(id, g.id) }))) },
      "-",
      { label: "Eliminar", kbd: "Supr", danger: true, action: () => remove(id) },
    ]);
  });
  grid.addEventListener("keydown", e => {
    const card = e.target.closest?.(".card"); if (!card || e.target !== card) return;
    if (e.key === "F2") { e.preventDefault(); rename(card.dataset.id); }
    if (e.key === "Delete") remove(card.dataset.id);
  });

  /* ---------- Sugerencias ---------- */
  const SUGGESTIONS = [
    { id: "templates", em: "🧩", title: "Empieza con una plantilla", text: "Detective, Kanban, Semana, Moodboard o Viaje: tableros listos para rellenar.", cta: "Ver plantillas", fn: () => openModal("detective") },
    { id: "backup", em: "💾", title: "Haz una copia de seguridad", text: "Guarda una copia de tus tableros en un USB o en una carpeta de la nube.", cta: "Ir a Datos", fn: () => location.href = "03-ajustes.html#datos" },
    { id: "dragcards", em: "🗂️", title: "Ordena arrastrando", text: "Arrastra una tarjeta sobre un grupo de la izquierda para moverla.", cta: "Entendido", fn: () => {} },
  ];
  function renderSuggestions() {
    const box = $("#suggest");
    const list = Tips.enabled && lib.boards.length ? SUGGESTIONS.filter(s => getPref("sug-" + s.id) === null) : [];
    box.hidden = !list.length || view === "fav";
    box.innerHTML = list.map(s => `<div class="sug" data-id="${s.id}"><span class="em">${s.em}</span><div><b>${s.title}</b><p>${s.text}</p><button class="link">${s.cta} →</button></div><button class="x" aria-label="Descartar sugerencia">✕</button></div>`).join("");
  }
  $("#suggest").onclick = e => {
    const el = e.target.closest(".sug"); if (!el) return;
    const s = SUGGESTIONS.find(x => x.id === el.dataset.id);
    if (e.target.closest(".x, .link")) { setPref("sug-" + s.id, "1"); renderSuggestions(); }
    if (e.target.closest(".link")) s.fn();
  };

  /* ---------- Nuevo tablero ---------- */
  const modal = $("#modal");
  function pickOpt(box, v) { box.querySelectorAll(".opt").forEach(o => o.classList.toggle("selected", o.dataset.v === v)); }
  function openModal(template = "blank") {
    $("#groupSelect").innerHTML = lib.groups.map(g => `<option value="${g.id}" ${g.id === (groupId || lib.groups[0]?.id) ? "selected" : ""}>${esc(g.name)}</option>`).join("");
    pickOpt($("#templates"), template);
    pickOpt($("#surfaces"), getPref("surface") || "dots");
    modal.classList.add("open");
    $("#boardName").value = "Sin título";
    $("#boardName").focus(); $("#boardName").select();
  }
  function closeModal() { modal.classList.remove("open"); }
  ["#templates", "#surfaces"].forEach(id => $(id).onclick = e => {
    const o = e.target.closest(".opt"); if (o) pickOpt($(id), o.dataset.v);
  });
  $("#newForm").onsubmit = e => {
    e.preventDefault();
    const q = new URLSearchParams({
      new: "1", template: $("#templates .selected").dataset.v, surface: $("#surfaces .selected").dataset.v,
      group: $("#groupSelect").value, name: $("#boardName").value.trim() || "Sin título",
    });
    location.href = "02-tablero.html?" + q;
  };

  document.addEventListener("keydown", e => {
    if (e.key === "Escape") closeModal();
    if (e.ctrlKey && e.key.toLowerCase() === "n") { e.preventDefault(); openModal(); }
    if (e.ctrlKey && e.key.toLowerCase() === "f") { e.preventDefault(); $("#search").focus(); }
    if (e.key === "?" && !e.target.matches("input, [contenteditable=true]")) showShortcuts(HELP.shortcuts);
  });

  /* ---------- Ayuda y tutorial ---------- */
  window.HELP = {
    tour: "boards",
    shortcuts: [
      { title: "Tableros", rows: [["Nuevo tablero", "Ctrl+N"], ["Buscar", "Ctrl+F"], ["Abrir tablero enfocado", "Enter"], ["Renombrar", "F2"], ["Eliminar", "Supr"], ["Ver atajos", "?"]] },
    ],
  };
  Tour.define("boards", [
    { el: null, title: "¡Estos son tus tableros!", text: "Te enseño esta pantalla en menos de un minuto. Puedes saltarlo y volver a verlo con el botón <b>?</b> de abajo a la izquierda." },
    { el: "#groupList", place: "right", title: "Grupos", text: "Organiza tus tableros en grupos como <b>Trabajo</b> o <b>Personal</b>. Usa <b>+</b> para crear uno y clic derecho para renombrarlo o cambiar su color." },
    { el: () => document.querySelector('.sidebar a[href*="view=fav"]'), place: "right", title: "Favoritos y recientes", text: "Marca un tablero con la ⭐ y lo tendrás siempre en <b>Favoritos</b>. <b>Recientes</b> muestra lo último que editaste." },
    { el: () => grid.querySelector(".card"), title: "Cada tarjeta es un tablero", text: "Haz clic para abrirlo. Con <b>clic derecho</b> lo renombras, duplicas o mueves. También puedes <b>arrastrarlo</b> sobre un grupo de la izquierda." },
    { el: ".search", title: "Busca y filtra", text: "Escribe parte del nombre (atajo <b>Ctrl+F</b>) o usa los filtros de abajo." },
    { el: "#newBtn", place: "bottom", title: "Crea un tablero", text: "Elige nombre, grupo, fondo y, si quieres, una <b>plantilla</b> para no empezar de cero. Atajo: <b>Ctrl+N</b>." },
    { el: "#helpBtn", place: "right", title: "¿Dudas?", text: "Desde aquí vuelves a ver este tutorial, consultas los atajos o activas y desactivas las sugerencias." },
  ]);

  render();
  renderSuggestions();
  Tour.auto("boards");
  setTimeout(() => {
    if (!Tour.active && lib.boards.length > 2 && !lib.boards.some(b => b.fav))
      Tips.show("fav", "Marca con la ⭐ los tableros que más uses para encontrarlos rápido en Favoritos.");
  }, 1500);
</script>
</body>
</html>
