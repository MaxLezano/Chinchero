# Instalador de Windows (NSIS) y publicación en GitHub Releases.
# Las actualizaciones automáticas (electron-updater) leen las releases de este mismo repositorio.
appId: com.maxlezano.chinchero
productName: Chinchero
copyright: Copyright © 2026 Max Lezano

directories:
  output: dist
  buildResources: build

files:
  - src/**/*
  - build/icon.png
  - package.json

# Fuses: interruptores de Electron fijados en el .exe al empaquetar (no afectan a `npm start` ni a las pruebas).
# Nadie puede usar Chinchero.exe como Node (ELECTRON_RUN_AS_NODE, NODE_OPTIONS, --inspect)
# y solo carga un app.asar que no haya sido modificado.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  # Las pantallas ya se sirven con chinchero://app (main.js). Sigue activo una versión más para que se puedan copiar las
  # preferencias que la 0.2 dejó en el localStorage de file:// (sin él no se pueden leer): se desactiva en la versión siguiente
  grantFileProtocolExtraPrivileges: true

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
  artifactName: Chinchero-Setup-${version}.${ext}

# Doble clic en un .chinchero lo importa como tablero nuevo (usa el icono de la app)
fileAssociations:
  - ext: chinchero
    name: Tablero de Chinchero
    description: Tablero de Chinchero

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Chinchero
  # Los tableros viven en Documentos\Chinchero: desinstalar nunca los borra
  deleteAppDataOnUninstall: false

publish:
  provider: github
  owner: MaxLezano
  repo: Chinchero
  releaseType: release
