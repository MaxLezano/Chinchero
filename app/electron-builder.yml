# Instalador de Windows (NSIS) y publicación en GitHub Releases.
# Las actualizaciones automáticas (electron-updater) leen las releases de este mismo repositorio.
appId: com.maxlezano.chinchero
productName: Chinchero
copyright: Copyright © 2026 Max Lezano

directories:
  output: dist
  buildResources: build

files:
  - src/**/*
  - build/icon.png
  - package.json

# Fuses: interruptores de Electron fijados en el .exe al empaquetar (no afectan a `npm start` ni a las pruebas).
# Nadie puede usar Chinchero.exe como Node (ELECTRON_RUN_AS_NODE, NODE_OPTIONS, --inspect)
# y solo carga un app.asar que no haya sido modificado.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  # Las pantallas se sirven con chinchero://app (main.js), así que file:// no necesita privilegios extra
  grantFileProtocolExtraPrivileges: false

# Sin arquitectura fija: la elige scripts/dist.js (npm run dist), que compila la x64 y la ARM64 por separado
# y une sus latest.yml. Con arch aquí, --arm64 se sumaría a la x64 en un solo instalador del doble de tamaño.
win:
  target:
    - nsis
  icon: build/icon.png
  artifactName: Chinchero-Setup-${version}.${ext}

# Doble clic en un .chinchero lo importa como tablero nuevo (usa el icono de la app)
fileAssociations:
  - ext: chinchero
    name: Tablero de Chinchero
    description: Tablero de Chinchero

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Chinchero
  # Los tableros viven en Documentos\Chinchero: el desinstalador pregunta si conservarlos (build/installer.nsh)
  deleteAppDataOnUninstall: false

publish:
  provider: github
  owner: MaxLezano
  repo: Chinchero
  releaseType: release
